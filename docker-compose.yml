services:
  postgres:
    image: postgres:16-alpine
    container_name: assetflow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assetflow
    volumes:
      - assetflow_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assetflow"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  assetflow_pg_data:
